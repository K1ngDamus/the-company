name: CI

# Pushes to a PR branch already fire `pull_request`. Listening to push on
# every branch as well would run the whole job twice for one push, so push is
# scoped to main (post-merge) and PR branches are covered by pull_request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push does not need to finish; cancel it and save the minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Structure and links: one h1 per page, meta descriptions in range,
      # canonicals, valid JSON-LD, no dead links or anchors, labelled inputs
      # and SVGs, and the FPC mark on every page (company law, bible v1.3).
      - name: Audit pages
        run: npm run audit

      # The palette against the AA floor. Reads the tokens out of global.css
      # rather than repeating them, so it cannot drift into false assurance.
      - name: Check contrast
        run: npm run contrast

      # The site has to be correct at two addresses: its own domain, and a
      # GitHub Pages project URL where every path is nested under /the-company.
      # This rebuilds mounted there and re-audits. A link written as a bare
      # "/contact" instead of link("/contact") is a dead link here and nowhere
      # else, so this is the only thing standing between that mistake and a
      # broken preview.
      - name: Build at a mounted path
        run: npm run check:mounted

      # Whether the site lets Google index it is decided by comparing where it
      # is served against the canonical address. Getting that wrong breaks
      # nothing visible — the site loads, looks right, and is silently absent
      # from search. It went wrong once, on 2026-08-25, because GitHub Pages
      # reports http:// until Enforce HTTPS is on. This builds at four
      # addresses and asserts the indexing decision each one must produce.
      - name: Check the canonical address
        run: npm run check:canonical
